<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sprawa Tupeene'a</title>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Limelight&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Courier+Prime:wght@400;700&display=swap">
<style>
/* Układ: wąska teczka akt sprawy — kartki dossier, telegramy maszynowe, czerwone pieczęcie; jeden rozdział = jedna warstwa */
:root{
  --papier:#e8ebe6; --karta:#f7f8f5; --karta2:#eef1ec; --linia:#c4cbc3;
  --atrament:#1c2230; --szary:#5d6672;
  --pieczec:#b3302a; --mosiadz:#8a6a1f; --zielen:#2f7a55;
  --f-tytul:"Limelight","Didot","Bodoni 72",Georgia,serif;
  --f-txt:"Source Serif 4","Iowan Old Style",Georgia,serif;
  --f-mono:"Courier Prime","Courier New",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --papier:#12161d; --karta:#1b2029; --karta2:#222834; --linia:#333b49;
  --atrament:#e7e9e4; --szary:#9aa3ae; --pieczec:#e46a5e; --mosiadz:#d3ae5c; --zielen:#5cbf8c; color-scheme:dark}}
:root[data-theme="dark"]{
  --papier:#12161d; --karta:#1b2029; --karta2:#222834; --linia:#333b49;
  --atrament:#e7e9e4; --szary:#9aa3ae; --pieczec:#e46a5e; --mosiadz:#d3ae5c; --zielen:#5cbf8c; color-scheme:dark}
html{background:var(--papier)}
body{background:var(--papier);color:var(--atrament);font-family:var(--f-txt);font-size:17px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--papier)}
.wrap{max-width:660px;margin:0 auto}
h1,h2{font-family:var(--f-tytul);font-weight:400;line-height:1.05;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:clamp(2.5rem,12vw,4rem)}
h2{font-size:clamp(1.8rem,7vw,2.4rem)}
h3{font-family:var(--f-mono);font-size:.82rem;letter-spacing:.16em;text-transform:uppercase;color:var(--szary);margin:6px 0 0;font-weight:700}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.etykieta{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--szary)}
.stos{display:flex;flex-direction:column;gap:18px}
/* pasek */
.pasek{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--papier);border-bottom:2px solid var(--atrament);
  display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;margin-bottom:20px;flex-wrap:wrap}
.pasek .lewy{display:flex;gap:8px}
.btn{font:inherit;font-family:var(--f-mono);font-size:.86rem;background:var(--karta);color:var(--atrament);border:1.5px solid var(--atrament);
  border-radius:2px;padding:8px 12px;cursor:pointer;line-height:1.2}
.btn:hover:not([disabled]){background:var(--karta2)}
.btn:focus-visible,input:focus-visible,select:focus-visible,.opcja:focus-visible,.zeton:focus-visible{outline:3px solid var(--mosiadz);outline-offset:2px}
.btn.glowny{background:var(--atrament);color:var(--papier);font-weight:700}
.btn[disabled]{opacity:.4;cursor:not-allowed}
/* okładka */
.okladka{padding-block:14px 4px;display:flex;flex-direction:column;gap:14px;position:relative}
.pieczec{display:inline-block;align-self:flex-start;font-family:var(--f-mono);font-weight:700;letter-spacing:.2em;color:var(--pieczec);
  border:3px solid var(--pieczec);padding:4px 10px;transform:rotate(-4deg);font-size:.9rem}
.sygn{font-family:var(--f-mono);font-size:.8rem;color:var(--szary);border-top:1px dashed var(--linia);border-bottom:1px dashed var(--linia);padding:6px 0}
input[type=text],input[type=number],select{font:inherit;font-family:var(--f-mono);background:var(--karta);color:var(--atrament);
  border:1.5px solid var(--linia);border-radius:2px;padding:9px 10px;min-width:0;width:100%;box-sizing:border-box}
label.etykieta{display:block}
/* spis rozdziałów */
.spis{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.spis li{border-bottom:1px solid var(--linia)}
.spis button{all:unset;cursor:pointer;display:grid;grid-template-columns:3.2rem 1fr auto;gap:10px;align-items:baseline;padding:12px 2px;width:100%;box-sizing:border-box}
.spis button:focus-visible{outline:3px solid var(--mosiadz)}
.spis .w{font-family:var(--f-mono);font-weight:700;color:var(--pieczec);font-size:.9rem}
.spis .t{font-family:var(--f-txt);font-weight:600;font-size:1.05rem;min-width:0}
.spis .t small{display:block;font-weight:400;color:var(--szary);font-family:var(--f-mono);font-size:.74rem;letter-spacing:.06em}
.spis .s{font-family:var(--f-mono);font-size:.78rem;color:var(--szary);white-space:nowrap}
.spis li.zamkniete .t{color:var(--szary)}
.spis li.zrobione .s{color:var(--zielen)}
/* rozdział */
.telegram{font-family:var(--f-mono);background:var(--karta);border:1px solid var(--linia);padding:14px 16px;font-size:.95rem;line-height:1.6;
  box-shadow:3px 3px 0 var(--linia)}
.telegram b{color:var(--pieczec)}
.karta{background:var(--karta);border-left:3px solid var(--atrament);padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.karta h4{margin:0;font-family:var(--f-txt);font-weight:600;font-size:1.02rem}
.karta ul{margin:0;padding-left:20px}
.wzor{font-family:var(--f-mono);background:var(--karta2);padding:8px 10px;font-size:.88rem;overflow-x:auto;white-space:pre}
.replika{display:grid;grid-template-columns:5.2rem 1fr;gap:4px 10px;font-size:.98rem}
.replika dt{font-family:var(--f-mono);font-weight:700;font-size:.8rem;letter-spacing:.06em;padding-top:3px}
.replika dd{margin:0;min-width:0}
.zagadka{background:var(--karta);border:1px solid var(--linia);padding:14px;display:flex;flex-direction:column;gap:10px}
.zagadka.rozw{border-color:var(--zielen)}
.zagadka .nr{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.opcje{display:flex;flex-direction:column;gap:8px}
.opcja{font:inherit;text-align:left;background:var(--papier);color:var(--atrament);border:1.5px solid var(--linia);border-radius:2px;padding:10px 12px;cursor:pointer}
.opcja:hover:not([disabled]){border-color:var(--atrament)}
.opcja.zla{border-color:var(--pieczec);color:var(--szary);text-decoration:line-through}
.opcja.dobra{border-color:var(--zielen);font-weight:600}
.opcja[disabled]{cursor:default}
.liczba{display:flex;gap:8px;flex-wrap:wrap}
.liczba input{flex:1 1 140px;width:auto}
.wyjasnienie{font-size:.95rem;border-top:1px dashed var(--linia);padding-top:8px}
.ok{color:var(--zielen)} .zle{color:var(--pieczec)}
/* układanki */
.tor{display:flex;flex-wrap:wrap;gap:6px;min-height:46px;padding:8px;border:1.5px dashed var(--linia);background:var(--papier)}
.pula{display:flex;flex-wrap:wrap;gap:6px}
.zeton{font:inherit;font-family:var(--f-mono);font-size:.86rem;background:var(--karta2);color:var(--atrament);border:1.5px solid var(--atrament);
  border-radius:2px;padding:7px 10px;cursor:pointer}
.tor .zeton{background:var(--atrament);color:var(--papier)}
.tor .zeton .n{opacity:.6;margin-right:4px}
.dopasuj{display:grid;grid-template-columns:1fr minmax(8rem,11rem);gap:8px 10px;align-items:center}
.dopasuj span{min-width:0}
.para{border:1px dashed var(--mosiadz);padding:12px 14px;background:var(--karta)}
.nawigacja{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
/* zrzut szesnastkowy */
.hex{font-family:var(--f-mono);font-size:.86rem;background:var(--karta2);padding:10px;overflow-x:auto;white-space:pre;line-height:1.7}
.hex .p1{color:var(--pieczec);font-weight:700}.hex .p2{color:var(--zielen);font-weight:700}.hex .p3{color:var(--mosiadz);font-weight:700}
/* certyfikat */
.cert{border:3px double var(--atrament);background:var(--karta);padding:22px 18px;display:flex;flex-direction:column;gap:12px;text-align:center;position:relative}
.cert .imie{font-family:var(--f-tytul);font-size:2rem;line-height:1.1;word-break:break-word}
.cert ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px;text-align:left}
.cert li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dotted var(--linia);padding-bottom:4px;font-size:.95rem}
.cert li span:last-child{font-family:var(--f-mono);color:var(--szary);white-space:nowrap}
.haiku{font-style:italic;font-size:1.08rem;line-height:1.7}
.zegar-duzy{font-family:var(--f-mono);font-size:clamp(3rem,18vw,7rem);line-height:1;font-variant-numeric:tabular-nums}
.plan li{padding:4px 0}.plan li.teraz{color:var(--pieczec);font-weight:700}
dialog{background:var(--karta);color:var(--atrament);border:2px solid var(--atrament);max-width:620px;width:calc(100% - 32px);max-height:85vh;padding:0}
dialog::backdrop{background:rgba(10,12,16,.6)}
dialog .wnetrze{padding:18px;display:flex;flex-direction:column;gap:12px}
dl.slow{margin:0;display:flex;flex-direction:column;gap:10px}
dl.slow dt{font-weight:600} dl.slow dd{margin:0;font-size:.95rem;color:var(--szary)}
@keyframes stempel{0%{transform:scale(1.8) rotate(-12deg);opacity:0}60%{transform:scale(.95) rotate(-4deg);opacity:1}100%{transform:scale(1) rotate(-4deg)}}
.pieczec.nowa{animation:stempel .45s ease-out}
@media (prefers-reduced-motion:reduce){.pieczec.nowa{animation:none}}
</style>
</head>
<body>

<div class="wrap">
  <header class="pasek" id="pasek">
    <div class="lewy">
      <button class="btn" id="btn-spis" type="button">Akta</button>
      <button class="btn" id="btn-slownik" type="button">Słowniczek</button>
    </div>
    <div class="mono" style="display:flex;gap:12px;align-items:center;font-size:.86rem">
      <span id="zegarek">--:--</span>
      <span id="punkty" style="color:var(--pieczec);font-weight:700">0 rek.</span>
    </div>
  </header>
  <main id="ekran" class="stos" aria-live="polite"></main>
</div>

<dialog id="slownik"><div class="wnetrze">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2 style="font-size:1.6rem">Słowniczek</h2><button class="btn" type="button" id="zamknij-slownik">Zamknij</button></div>
  <dl class="slow" id="lista-slownik"></dl>
</div></dialog>

<script>
"use strict";
/* ===================== TREŚĆ ===================== */
const CZAS_GRY=20; // minut
const PLAN=[{od:0,do:3},{od:3,do:6},{od:6,do:9},{od:9,do:13},{od:13,do:16},{od:16,do:20}];

const ROZDZIALY=[
{ w:"PROLOG", tytul:"Pub nad Tamizą", warstwa:"warstwy i protokoły",
  telegram:`LONDYN STOP TUPEENE ZESŁANY NA BEZLUDNĄ WYSPĘ ZNALAZŁ NA PLAŻY TERMINAL SATELITARNY STOP NĘKA ŚWIAT PRZEZ SIEĆ STOP SPOTKANIE W PUBIE O ÓSMEJ STOP <b>ŚCIŚLE TAJNE</b>`,
  scena:[["Lupin","Proponuję wrzucić jego pakiety do klatki z lwami w zoo. Szybko, prosto, nikt nie zatęskni."],
         ["Bond","Wykluczone! Lwy mają swoje prawa. Co one komu zawiniły? Takie pakiety są ciężkostrawne. Wystrzelmy jego pakiety w kosmos, na orbitę geostacjonarną."],
         ["Sholmes","Sprzeciwiam się z trzech powodów. Po pierwsze, obieg do satelity geostacjonarnego trwa ok. 240 ms i każdy pakiet tylko zyska na dramatyzmie. Po drugie, Tupeene już raz przejął satelitę. Po trzecie, papierologia. Panowie, zanim go złapiemy, musimy zrozumieć, przez co jego pakiety przechodzą. Warstwa po warstwie."]],
  karty:[`<h4>Protokół i usługa</h4><p><b>Protokół</b> to reguły rozmowy równorzędnych warstw w różnych urządzeniach (w poziomie). <b>Usługa</b> to to, co warstwa daje warstwie wyższej w tym samym urządzeniu (w pionie).</p>`,
         `<h4>Zasady gry</h4><ul><li>Poprawna odpowiedź za pierwszym razem: <b>10 rekomendacji</b>, za drugim 5, za trzecim 2. Po trzech błędach Sholmes zdradza odpowiedź.</li><li>Kolejny rozdział otwiera się po rozwiązaniu wszystkich zadań poprzedniego.</li><li>Wolno naradzać się z sąsiadem.</li></ul>`],
  pytania:[
   {t:"ord",q:"Proszę ułożyć warstwy modelu OSI <b>od dołu</b> (od nr 1). Stuknięcie kafelka dodaje go na koniec, stuknięcie w torze usuwa.",
    el:["fizyczna","łącza danych","sieciowa","transportowa","sesji","prezentacji","aplikacji"],mix:[4,1,6,2,0,5,3],
    e:"F Ł S T S P A — „Fryderyk Łowi Sardynki, Tomasz Sprzedaje Pieczone Ananasy”."},
   {t:"mc",q:"Tłumacz w Londynie i tłumacz w Paryżu nigdy się nie spotkali, ale mają wspólny słownik i zasady przekładu. W modelu warstwowym to:",
    o:["protokół","usługa","interfejs","medium fizyczne"],a:0,e:"Reguły rozmowy równorzędnych warstw to protokół. Usługa działa w pionie, w jednym urządzeniu."},
   {t:"mc",q:"Bond chce wiedzieć, w której warstwie OSI działa protokół IP.",
    o:["3 · sieciowa","2 · łącza danych","4 · transportowa","7 · aplikacji"],a:0,e:"IP to adresy logiczne i trasowanie: warstwa sieciowa."}
  ]},
{ w:"W7", tytul:"Książę z Pacyfiku", warstwa:"warstwa aplikacji",
  telegram:`SKRZYNKI POCZTOWE ZALANE STOP NADAWCA PODAJE SIĘ ZA KSIĘCIA WYSP SALOMONOWYCH I PROSI O PRZELEW STOP LINK PROWADZI DO STRONY UDAJĄCEJ BANK STOP`,
  scena:[["Sholmes","Elementarne. Zanim przeglądarka ofiary pokazała tę stronę, musiała najpierw zamienić nazwę na adres, a potem nawiązać połączenie. Każdy krok zostawia ślad w innej warstwie."],
         ["Lupin","Ja w młodości po prostu wchodziłem przez okno. Bez nazw, bez adresów."]],
  karty:[`<h4>Od nazwy do strony</h4><div class="wzor">DNS (nazwa → adres IP)    UDP, port 53
TCP: SYN, SYN-ACK, ACK     1 RTT
TLS 1.3: uzgodnienie      1 RTT
HTTP: GET / → 200 OK      1 RTT</div><p>Porty: <b>53</b> DNS, <b>80</b> HTTP, <b>443</b> HTTPS, <b>22</b> SSH, <b>25</b> SMTP.</p>`],
  pytania:[
   {t:"ord",q:"Proszę ułożyć kroki wejścia ofiary na fałszywą stronę w kolejności, w jakiej zachodzą.",
    el:["DNS: jaki adres ma ta nazwa?","TCP: uzgodnienie trójetapowe","TLS: uzgodnienie szyfrowania","HTTP: GET /"],mix:[2,0,3,1],
    e:"Najpierw nazwa → adres, potem połączenie TCP, potem szyfrowanie, na końcu żądanie strony."},
   {t:"mc",q:"Do czego służy DNS?",o:["Zamienia nazwy domen na adresy IP","Szyfruje strony WWW","Wybiera trasę pakietu","Zamienia adres IP na adres MAC"],a:0,e:"Adres IP → MAC to ARP (rozdział IV)."},
   {t:"num",q:"Fałszywy „bank” przyjmuje połączenia szyfrowane HTTPS. Na jakim porcie TCP nasłuchuje?",a:443,tol:0,j:"",e:"HTTPS = HTTP przez TLS, standardowo port 443."},
   {t:"mc",q:"Sholmes mówi: „HTTPS nie dowodzi, że strona należy do banku”. Co naprawdę zapewnia TLS?",
    o:["Szyfrowanie i to, że łączymy się z właścicielem certyfikatu dla tej nazwy, nawet jeśli nazwa jest podstępna","Że strona jest uczciwa","Że nadawca e-maila jest księciem","Że pakiety nie zginą"],a:0,
    e:"TLS chroni rozmowę i potwierdza nazwę. Nie ocenia uczciwości właściciela: podobna nazwa z kłódką to wciąż obca strona."}
  ]},
{ w:"W4", tytul:"Uścisk dłoni", warstwa:"warstwa transportowa",
  telegram:`SERWER SCOTLAND YARDU PRZECIĄŻONY STOP TYSIĄCE ROZPOCZĘTYCH POWITAŃ BEZ ODPOWIEDZI STOP SERWER CZEKA UPRZEJMIE NA KAŻDE STOP`,
  scena:[["Lupin","Nieeleganckie! Ktoś wyciąga rękę, czeka, aż ją uściśniemy, i… odchodzi. Tysiące razy. Gentleman tak nie postępuje."],
         ["Sholmes","To połówki uzgodnienia trójetapowego TCP. Serwer rezerwuje miejsce dla każdego rozpoczętego połączenia, aż zabraknie miejsca dla uczciwych gości. Obrona istnieje, ale to temat na inny wykład."],
         ["Bond","A moje rozmowy z centralą? Też przez TCP?"],
         ["Sholmes","Głos zwykle przez UDP. Spóźnione słowo jest bezużyteczne."]],
  karty:[`<h4>TCP i UDP</h4><ul><li><b>TCP</b>: połączeniowy, potwierdzenia, retransmisje, kolejność. Nagłówek 20 B.</li><li><b>UDP</b>: bez połączenia i gwarancji, szybki. Nagłówek 8 B.</li><li><b>Port</b> wskazuje program w urządzeniu.</li></ul>`],
  pytania:[
   {t:"ord",q:"Proszę ułożyć uzgodnienie trójetapowe TCP, jakie powinien był dokończyć Tupeene.",
    el:["klient → serwer: SYN","serwer → klient: SYN-ACK","klient → serwer: ACK"],mix:[2,0,1],
    e:"Tupeene wysyła tylko SYN i nigdy nie odpowiada ACK. Serwer czeka na trzeci krok."},
   {t:"mc",q:"Dlaczego rozmowy Bonda z centralą (głos) idą zwykle przez UDP?",
    o:["Spóźniony pakiet głosu jest bezużyteczny, a retransmisje TCP wstrzymałyby rozmowę","UDP szyfruje rozmowy","UDP ma dłuższy nagłówek","TCP nie działa przez satelitę"],a:0,
    e:"Dla głosu ważniejsze jest małe opóźnienie niż komplet danych."},
   {t:"num",q:"RTT do serwera Scotland Yardu wynosi 80 ms, do serwera DNS 10 ms. Po ilu ms przyjdzie pierwszy bajt strony przy TCP + TLS 1.3 + HTTP?",
    a:250,tol:0,j:"ms",e:"10 + 3 × 80 = 250 ms."},
   {t:"mc",q:"Co w warstwie transportowej wskazuje, do którego programu na serwerze trafią dane?",
    o:["numer portu","adres MAC","pole TTL","nazwa domeny"],a:0,e:"Adres IP wskazuje budynek, port wskazuje mieszkanie."}
  ]},
{ w:"W3", tytul:"Odciski palców w nagłówku", warstwa:"warstwa sieciowa",
  telegram:`PRZECHWYCONO PAKIET TUPEENE'A STOP POCZĄTEK NAGŁÓWKA W ZAŁĄCZNIKU STOP PROSZĘ USTALIĆ SKĄD I CO NIESIE STOP`,
  scena:[["Sholmes","Każdy nagłówek to odcisk palca. Pole TTL zdradza, ile routerów pakiet minął."],
         ["Lupin","Odpowiedzmy mu gołębiem pocztowym. RFC 1149 to przewiduje: IP przez ptaki."],
         ["Bond","Ptaki mają prawo do odpoczynku i do ośmiogodzinnego dnia lotu. Żadnych gołębi."]],
  karty:[`<h4>Załącznik: nagłówek IPv4 (pierwsze 20 B)</h4><div class="hex">45 00 05 dc 1c 46 00 00 <span class="p1">2f</span> <span class="p2">11</span> 9a 3e
<span class="p3">cb 00 71 07</span> c0 a8 01 0a</div>
<p class="mono" style="font-size:.82rem">bajt 9: <span class="ok">TTL</span> · bajt 10: protokół · bajty 13–16: adres nadawcy · 17–20: adres odbiorcy. Liczby szesnastkowe: 0x2f = 47, 0x11 = 17, 0xcb = 203, 0x71 = 113.</p>`,
         `<h4>TTL i fragmentacja</h4><p>Każdy router zmniejsza <b>TTL</b> o 1. Pakiet za duży na łącze zostaje pocięty na fragmenty; danych w fragmencie jest co najwyżej MTU − 20 B (wielokrotność 8).</p>`],
  pytania:[

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ===================== ZEGAR ===================== */
const mmss=ms=>{const s=Math.max(0,Math.floor(ms/1000));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");};
function tykaj(){
  const z=document.getElementById("zegarek");
  if(!S.start){z.textContent="--:--";return;}
  const ms=Date.now()-S.start,m=ms/60000,i=PLAN.findIndex(p=>m>=p.od&&m<p.do);
  z.textContent=mmss(ms)+" · "+(m>=CZAS_GRY?"czas na toast":ROZDZIALY[i].w);
}
setInterval(tykaj,1000);
function odswiezPunkty(){document.getElementById("punkty").textContent=suma()+" rek.";}

/* ===================== ZADANIA ===================== */
function tasuj(id,n){ // stała dla danego zadania, ale niezależna od kolejności w danych permutacja odpowiedzi
  let h=2166136261;for(const c of id+"#")h=Math.imul(h^c.charCodeAt(0),16777619)>>>0;
  const a=[...Array(n).keys()];
  for(let i=n-1;i>0;i--){h=Math.imul(h^(h>>>15),2246822519)>>>0;const j=h%(i+1);[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
const PKT=[10,5,2];
function zadanie(k,i,q){
  const id=qid(k,i),el=document.createElement("div");el.className="zagadka";
  const o=S.odp[id]||(S.odp[id]={proby:0,koniec:false,pkt:0,zle:[]});
  let tor=[], wyb=[]; // stan układanki i przyporządkowania
  function wynik(dobrze,j){
    if(o.koniec)return;
    if(dobrze){o.pkt=PKT[o.proby]||0;o.koniec=true;}
    else{o.proby++;if(j!==undefined)o.zle.push(j);if(o.proby>=3){o.koniec=true;o.pkt=0;}}
    zapisz();rysuj();odswiezPunkty();nawigacja(k);
  }
  function rysuj(){
    el.classList.toggle("rozw",o.koniec);
    let srodek="";
    if(q.t==="mc"){
      srodek=`<div class="opcje">${tasuj(id,q.o.length).map(j=>{const t=q.o[j];let c="opcja";if(o.zle.includes(j))c+=" zla";if(o.koniec&&j===q.a)c+=" dobra";
        return `<button type="button" class="${c}" data-j="${j}" ${(o.koniec||o.zle.includes(j))?"disabled":""}>${t}</button>`;}).join("")}</div>`;
    }else if(q.t==="num"){
      srodek=`<div class="liczba"><input type="text" inputmode="decimal" id="in-${id}" aria-label="odpowiedź" placeholder="wynik${q.j?" w "+q.j:""}" ${o.koniec?"disabled":""} value="${o.koniec?q.a:""}"><button class="btn" type="button" data-s ${o.koniec?"disabled":""}>Sprawdź</button></div>`;
    }else if(q.t==="ord"){
      const pokaz=o.koniec?q.el.map((_,j)=>j):tor;
      srodek=`<div class="tor" aria-label="ułożona kolejność">${pokaz.length?pokaz.map((j,n)=>`<button type="button" class="zeton" data-t="${n}" ${o.koniec?"disabled":""}><span class="n">${n+1}.</span>${q.el[j]}</button>`).join(""):`<span class="etykieta" style="align-self:center">tu pojawi się kolejność</span>`}</div>
        ${o.koniec?"":`<div class="pula">${q.mix.filter(j=>!tor.includes(j)).map(j=>`<button type="button" class="zeton" data-p="${j}">${q.el[j]}</button>`).join("")}</div>
        <div><button class="btn" type="button" data-s ${tor.length===q.el.length?"":"disabled"}>Sprawdź kolejność</button></div>`}`;
    }else if(q.t==="dop"){
      srodek=`<div class="dopasuj">${q.el.map(([t,kat],j)=>`<span>${t}</span><select id="s-${id}-${j}" aria-label="${esc(t)}" ${o.koniec?"disabled":""}>
        <option value="">wybierz…</option>${q.kat.map(c=>`<option ${(o.koniec?c===kat:wyb[j]===c)?"selected":""}>${c}</option>`).join("")}</select>`).join("")}</div>
        ${o.koniec?"":`<div><button class="btn" type="button" data-s>Sprawdź przyporządkowanie</button></div>`}`;
    }
    let stat="";
    if(o.koniec)stat=o.pkt>0?`<span class="ok mono">+${o.pkt} rek.</span>`:`<span class="mono" style="color:var(--mosiadz)">Sholmes zdradził odpowiedź</span>`;
    else if(o.proby>0)stat=`<span class="zle mono">pudło ${o.proby}/3</span>`;
    el.innerHTML=`<div class="nr"><span class="etykieta">Zadanie ${i+1}</span>${stat}</div><p>${q.q}</p>${srodek}<p class="mono zle" data-info hidden></p>
      ${o.koniec?`<p class="wyjasnienie">${q.e}</p>`:""}`;
    const info=el.querySelector("[data-info]");
    if(q.t==="mc")el.querySelectorAll(".opcja").forEach(b=>b.onclick=()=>wynik(+b.dataset.j===q.a,+b.dataset.j));
    if(q.t==="num"){const inp=el.querySelector("input"),bt=el.querySelector("[data-s]");
      if(bt){bt.onclick=()=>{const v=parseFloat(inp.value.replace(/\s/g,"").replace(",","."));if(isNaN(v)){inp.focus();return;}wynik(Math.abs(v-q.a)<=q.tol);};
        inp.onkeydown=ev=>{if(ev.key==="Enter")bt.click();};}}
    if(q.t==="ord"&&!o.koniec){
      el.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{tor.push(+b.dataset.p);rysuj();});
      el.querySelectorAll(".tor [data-t]").forEach(b=>b.onclick=()=>{tor.splice(+b.dataset.t,1);rysuj();});
      const bt=el.querySelector("[data-s]");
      if(bt)bt.onclick=()=>{const dobrze=tor.filter((j,n)=>j===n).length;const ok=dobrze===q.el.length;
        if(!ok){tor=[];wynik(false);const inf=el.querySelector("[data-info]");if(inf&&!o.koniec){inf.hidden=false;inf.textContent=`Na swoim miejscu: ${dobrze} z ${q.el.length}. Proszę spróbować jeszcze raz.`;}}
        else wynik(true);};
    }
    if(q.t==="dop"&&!o.koniec){
      q.el.forEach((_,j)=>{const s=el.querySelector(`#s-${id}-${j}`);s.onchange=()=>{wyb[j]=s.value;};});
      el.querySelector("[data-s]").onclick=()=>{
        const w=q.el.map((_,j)=>el.querySelector(`#s-${id}-${j}`).value);
        if(w.some(x=>!x)){info.hidden=false;info.textContent="Proszę wybrać odpowiedź w każdym wierszu.";return;}
        const dobrze=w.filter((x,j)=>x===q.el[j][1]).length;
        if(dobrze===q.el.length)wynik(true);
        else{wynik(false);const inf=el.querySelector("[data-info]");if(inf&&!o.koniec){inf.hidden=false;inf.textContent=`Poprawnie: ${dobrze} z ${q.el.length}.`;}}
      };
    }
  }
  rysuj();return el;
}

/* ===================== CERTYFIKAT ===================== */
function kodWer(imie,pkt){let h=5381;const s=(imie||"").trim().toLowerCase()+"|"+pkt+"|AST-W5";for(const c of s)h=((h*33)^c.charCodeAt(0))>>>0;return h.toString(36).toUpperCase().slice(-6).padStart(6,"0");}
function ranga(p){return p>=.9?"Agent 0x07 z licencją na dekapsulację":p>=.75?"Dżentelmen-włamywacz warstw":p>=.5?"Detektyw nagłówków":"Praktykant Scotland Yardu";}

  const p=suma(),m=maks();
  if(!S.start||!ROZDZIALY.every((_,i)=>gotowy(i))){E.innerHTML=`<h2>Toast</h2><p>Wino czeka, ale sprawa nie jest jeszcze zamknięta. Proszę dokończyć wszystkie rozdziały.</p><div><button class="btn" type="button" onclick="location.hash='akta'">← Akta</button></div>`;return;}
  const d=new Date(),pr=p/m;
  const zdob=UMIEJETNOSCI.slice(0,Math.max(2,Math.round(pr*UMIEJETNOSCI.length)));
  E.innerHTML=`
   <div class="stos" style="gap:6px"><span class="etykieta">Epilog · mieszkanie Lupina</span><h2>Toast i rekomendacje</h2></div>
   <dl class="replika">
     <dt>NARRATOR</dt><dd>Bond z niewinnym uśmiechem stawia na stole butelkę <b>włoskiego</b> wina. Wie doskonale, że Lupin i Sholmes są koneserami francuskich trunków.</dd>
     <dt>LUPIN</dt><dd>(upija łyk i z godnością ukrywa tęsknotę za Bordeaux) Za warstwy.</dd>
     <dt>SHOLMES</dt><dd>I za nagłówki, które nigdy nie kłamią. W przeciwieństwie do ARP.</dd>
     <dt>NARRATOR</dt><dd>Potem siadają do laptopów i wystawiają sobie nawzajem rekomendacje w serwisie dla profesjonalistów. Jedną z nich dostają Państwo.</dd>
   </dl>
   <div class="cert">
     <span class="pieczec nowa" style="align-self:center">SPRAWA ZAMKNIĘTA</span>
     <span class="etykieta">Certyfikat rekomendacji · sygn. AST/W5/${d.getFullYear()}</span>
     <div class="imie">${esc(S.imie||"Agent bez nazwiska")}</div>
     <p>doprowadził(a) do odizolowania łotra Tupeene'a, przechodząc za nim przez wszystkie warstwy modelu OSI, i otrzymuje</p>
     <div class="zegar-duzy" style="font-size:3rem">${p} / ${m}</div>
     <p class="mono">rekomendacji (${Math.round(100*pr)}%) · ranga: <b style="color:var(--pieczec)">${ranga(pr)}</b></p>
     <ul>${zdob.map(([u,kto])=>`<li><span>${u}</span><span>— ${kto}</span></li>`).join("")}</ul>
     <p class="mono" style="font-size:.8rem;color:var(--szary)">${d.toLocaleString("pl-PL")} · kod weryfikacyjny: <b style="color:var(--atrament)">${kodWer(S.imie,p)}</b></p>
   </div>
   <div class="karta"><span class="etykieta">Sholmes recytuje haiku o przyjaźni angielsko-francuskiej</span>
     <p class="haiku">Mgła nad Tamizą,<br>pakiet w kopercie płynie —<br>przyjaźń dwóch brzegów.</p></div>
   <p style="color:var(--szary);font-size:.95rem">Proszę zrobić zrzut ekranu certyfikatu. Wiedza z tej sprawy może pojawić się w quizie na ćwiczeniach.</p>
   <div class="nawigacja"><button class="btn" type="button" id="dm">← Akta</button></div>`;
  document.getElementById("dm").onclick=()=>idz("akta");window.scrollTo(0,0);
}

/* ===================== RZUTNIK ===================== */
let rzStart=null;
function widokRzutnik(){
  E.innerHTML=`<div class="stos" style="padding-top:16px">
   <span class="etykieta">Tryb rzutnika · Wykład 5</span>
   <h1>Sprawa Tupeene'a</h1>

   <div class="karta"><h4>Sprawdzenie kodu z certyfikatu</h4>
     <label class="etykieta" for="w-imie">Imię z certyfikatu</label><input type="text" id="w-imie">

     <p class="mono" id="w-kod">Kod: –</p></div></div>`;
  const z=document.getElementById("rz-zegar");
  const t=setInterval(()=>{if(!rzStart)return;const ms=CZAS_GRY*60000-(Date.now()-rzStart),m=(Date.now()-rzStart)/60000;
    z.textContent=ms>0?mmss(ms):"TOAST!";
    document.querySelectorAll("#rz-plan li").forEach(li=>{const p=PLAN[+li.dataset.i];li.classList.toggle("teraz",m>=p.od&&m<p.do);});},500);
  document.getElementById("rz-start").onclick=()=>{rzStart=Date.now();};
  const wk=()=>{document.getElementById("w-kod").textContent="Kod: "+kodWer(document.getElementById("w-imie").value,document.getElementById("w-pkt").value);};
  document.getElementById("w-imie").oninput=wk;document.getElementById("w-pkt").oninput=wk;
  sprzatanie=()=>clearInterval(t);
}

/* ===================== START ===================== */
if(!location.hash&&S.start)location.hash="akta";
